# path : /apps/android/gradle.properties
# 
# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Kotlin code style for this project: "official" or "obsolete"
kotlin.code.style=official

# Gradle performance settings
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.vfs.watch=true

# Kotlin performance settings
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.compiler.execution.strategy=in-process

# Android build settings
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Release signing config
HELLO_UPLOAD_STORE_FILE=hello-release-key.jks
HELLO_UPLOAD_KEY_ALIAS=hello
HELLO_UPLOAD_STORE_PASSWORD=hello123456
HELLO_UPLOAD_KEY_PASSWORD=hello123456
