# path : /apps/android/gradle.properties

# Gradle performance settings
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# Kotlin performance settings
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx2g

# Android build settings
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.disallowKotlinSourceSets=false

# Release signing config
HELLO_UPLOAD_STORE_FILE=hello-release-key.jks
HELLO_UPLOAD_KEY_ALIAS=hello
HELLO_UPLOAD_STORE_PASSWORD=hello123456
HELLO_UPLOAD_KEY_PASSWORD=hello123456
